# 10x10 grid, 5 districts.
#   julia --project=. run_cyclewalk_toml.jl toml/param_grid10x10.toml
# Every key is documented in ../../docs/run_cyclewalk_toml.md

[plans]
pop_dev = 0.0001
num_dists = 5
node_data=["county", "node_name", "population","area","border_length"]
geo_units=["node_name"]
pop_col="population"
area_col="area"
node_border_col="border_length"
edge_perimeter_col="length"
map_directory=["data","grid"]
map_file="grid_graph_10_by_10.json"

[mcmc]
cycle_walk_steps = 2e4
two_cycle_walk_frac = 0.3

# The target measure: one [[measure.energy]] block per energy, each weighted by a
# number or by arithmetic over the parameters named in [measure]. A weight of zero
# drops its energy, so gamma=0/iso_weight=0 below samples the plain spanning-forest
# measure; raise either (here, or with --gamma / --iso_weight) to weight the target.
[measure]
gamma=0.0
iso_weight=0.0

[[measure.energy]]
name = "get_log_spanning_forests"
weight = "gamma"

[[measure.energy]]
name = "get_isoperimetric_score"
weight = "iso_weight"

[run]
thread_id = 1
atlasNameBase="grid10x10_cycleWalk"
outputDirectory=["output","grid","Grid_10x10"]
cycle_walk_out_freq=100
writer_stats=["get_log_spanning_trees"]
compress="gz"
run_diagnostics=false
